# Search-quality regression queries: `make eval` (uses the real embedding model).
#
# Each entry says "a person typing `query` should be shown instruction `expect` near the top".
# Rules for adding entries (see docs/CONTENT_GUIDE.md):
#   * Write 2-3 per new page, phrased the way a *user* would ask.
#   * Do NOT copy a page's `search_phrases`; a verbatim copy always scores ~1.0 and tests nothing.
#   * `expect` must be a slug in roster.yaml (or, with `kind: article`, an article slug). The check passes if it is
#     within the top `top` results of that kind (default 3).
#   * `top: 1` means the page must win outright. Set it when `make eval` shows the page at rank 1 with a lead of
#     at least 0.02 over the next page; leave the default for near ties (scores within ~0.01 are a tie).
#   * `negatives` are queries that have nothing to do with x86: every result for them must score below the
#     relevance floor (DOCX86_SEARCH_FLOOR). They keep the floor honest as pages are added. Only clearly off-topic
#     queries belong here: an x86 question that is merely out of scope (SIMD, floats, ring 0) scores as high as a
#     real one and is handled by the out-of-scope word hint instead (src/docx86/scope.py), not by the floor.
queries:
  - {query: "how many 1s are in this number", expect: popcnt}
  - {query: "which bits differ between two values", expect: xor, top: 1}
  - {query: "reset rax to 0", expect: xor}
  - {query: "load the address of a variable into a register", expect: lea}
  - {query: "compute rax times 5 in a single instruction", expect: lea}
  - {query: "get pointer to a global without a memory access", expect: lea, top: 1}
  - {query: "sum of two integers", expect: add}
  - {query: "carry flag after addition", expect: add, top: 1}
  # batch 2: foundations
  - {query: "copy rbx into rax", expect: mov, top: 1}
  - {query: "put the number 42 in a register", expect: mov, top: 1}
  - {query: "save rbx before calling a function", expect: push, top: 1}
  - {query: "get back the value I saved on the stack", expect: pop}
  - {query: "subtract two integers", expect: sub, top: 1}
  - {query: "is rax greater than rbx", expect: cmp}
  - {query: "check if rcx is zero", expect: test, top: 1}
  - {query: "is bit 3 set in this flags value", expect: test}
  - {query: "keep only the low byte of a value", expect: and, top: 1}
  - {query: "align a pointer down to a 16-byte boundary", expect: and, top: 1}
  - {query: "turn on bit 5 in a register", expect: or}
  - {query: "reverse all the bits of a number", expect: not, top: 1}
  - {query: "step an index by one but keep the carry", expect: inc, top: 1}
  - {query: "count down a loop register", expect: dec}
  - {query: "turn 5 into -5", expect: neg}
  # batch 3: multiply, divide, shift, widen, swap
  - {query: "multiply two 64-bit numbers and keep the full 128-bit result", expect: mul, top: 1}
  - {query: "multiply a register by a constant", expect: imul}
  - {query: "divide a negative number by a positive one", expect: idiv, top: 1}
  - {query: "what is the remainder after dividing", expect: div, top: 1}
  - {query: "shift a register left by three", expect: shl}
  - {query: "divide an unsigned value by eight with a shift", expect: shr}
  - {query: "shift right but keep the negative sign", expect: sar, top: 1}
  - {query: "convert an unsigned char to a larger integer", expect: movzx, top: 1}
  - {query: "extend a negative 32-bit integer to 64 bits", expect: movsx, top: 1}
  - {query: "swap rax and rbx", expect: xchg, top: 1}
  - {query: "insert filler bytes so the next function is aligned", expect: nop, top: 1}
  # batch 4: loops and conditional jumps
  - {query: "execute some code a fixed number of times using the counter register", expect: loop, top: 1}
  - {query: "go to a label when one number is smaller than another", expect: jcc}
  - {query: "skip this code when the zero flag is set", expect: jcc, top: 1}
  # articles (kind: article) -- written the way a person would ask, not copied from search_phrases
  - {query: "why does the shift count have to be in cl", kind: article, expect: rcx-count-register, top: 1}
  - {query: "which register receives the high half of a multiplication", kind: article, expect: rax-rdx-implicit-operands, top: 1}
  - {query: "which argument registers does linux use for function calls", kind: article, expect: abi-system-v-linux, top: 1}
  - {query: "what is the 32 byte home area the caller reserves on windows", kind: article, expect: abi-microsoft-x64-windows, top: 1}
  - {query: "how do I build a nasm program on linux", kind: article, expect: nasm-linux, top: 1}
  - {query: "how do I build a nasm program on windows", kind: article, expect: nasm-windows, top: 1}
  - {query: "which pointers do the string instructions use", kind: article, expect: rsi-rdi-string-registers, top: 1}
  - {query: "what is a stack frame and what is rbp for", kind: article, expect: rsp-rbp-stack-and-frame, top: 1}
  - {query: "which registers are special and why", kind: article, expect: registers-cheat-sheet, top: 1}
  - {query: "my program died with a general protection fault, what does that mean", kind: article, expect: cpu-exceptions, top: 1}
  - {query: "what does the processor do when an instruction cannot be executed", kind: article, expect: cpu-exceptions, top: 1}
  - {query: "why did my assembly program crash with sigfpe", kind: article, expect: cpu-exceptions, top: 1}
  # batch 5: string instructions
  - {query: "copy the memory at rsi to the address in rdi", expect: movs}
  - {query: "fill an array with the same value quickly", expect: stos, top: 1}
  - {query: "find the length of a zero-terminated string", expect: rep, top: 1}
  - {query: "repeat one instruction until the counter register is zero", expect: rep}

# Off-topic queries. Measured 2026-10-08 with 32 pages: these scored 0.46-0.62 against the closest page, every
# expected page above scored 0.649 or more, so the floor (0.64) sits between them. If one of these starts to
# leak after a new page is added, that page's phrases attract nonsense; fix the phrases, do not move the floor.
negatives:
  - "best pizza in warsaw"
  - "weather tomorrow in berlin"
  - "what is the capital of france"
  - "book a flight to lisbon"
  - "install nginx on ubuntu"
