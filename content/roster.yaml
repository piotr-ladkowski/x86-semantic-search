  # ---- miscellaneous ----
  - {slug: lea,     mnemonic: LEA,     category: miscellaneous, sdm: ["LEA—Load Effective Address"]}
  - {slug: nop,     mnemonic: NOP,     category: miscellaneous, sdm: ["NOP—No Operation"]}
  - {slug: ud2,     mnemonic: UD2,     category: miscellaneous, sdm: ["UD—Undefined Instruction"], note: "aliases UD0, UD1"}
  - {slug: xlat,    mnemonic: XLAT,    category: miscellaneous, sdm: ["XLAT/XLATB—Table Look-up Translation"], note: "alias XLATB"}
  - {slug: cpuid,   mnemonic: CPUID,   category: miscellaneous, sdm: ["CPUID—CPU Identification"]}
  - {slug: movbe,   mnemonic: MOVBE,   category: miscellaneous, sdm: ["MOVBE—Move Data After Swapping Bytes"]}
  - {slug: pause,   mnemonic: PAUSE,   category: miscellaneous, sdm: ["PAUSE—Spin Loop Hint"]}
  - {slug: rdtsc,   mnemonic: RDTSC,   category: miscellaneous, sdm: ["RDTSC—Read Time-Stamp Counter"]}
  - {slug: rdtscp,  mnemonic: RDTSCP,  category: miscellaneous, sdm: ["RDTSCP—Read Time-Stamp Counter and Processor ID"]}
  - {slug: syscall, mnemonic: SYSCALL, category: miscellaneous, sdm: ["SYSCALL—Fast System Call"]}
  - {slug: lock,    mnemonic: LOCK,    category: miscellaneous, sdm: ["LOCK—Assert LOCK# Signal Prefix"], note: "prefix; the atomicity story for ADD/XCHG/CMPXCHG..."}
  - {slug: endbr64, mnemonic: ENDBR64, category: miscellaneous, sdm: ["ENDBR64—Terminate an Indirect Branch in 64-bit Mode"]}

  # ---- random-number ----
  - {slug: rdrand, mnemonic: RDRAND, category: random-number, sdm: ["RDRAND—Read Random Number"]}
  - {slug: rdseed, mnemonic: RDSEED, category: random-number, sdm: ["RDSEED—Read Random SEED"]}

# Undecided. Not counted in progress and no pages allowed until promoted into `instructions`.
deferred:
  - mnemonics: [LFENCE, MFENCE, SFENCE, PREFETCHh, PREFETCHW, CLFLUSH, CLFLUSHOPT, MOVNTI]
    reason: "Memory-ordering and cache-control instructions. Usable at ring 3 and GPR/memory based, but not integer arithmetic. Owner decision: does 'general-purpose' scope include them?"
  - mnemonics: [RDFSBASE, RDGSBASE, WRFSBASE, WRGSBASE]
    reason: "GPR-only and ring-3 capable, but only if the OS sets CR4.FSGSBASE. Niche; decide with owner."
  - mnemonics: [XGETBV, RDPID]
    reason: "Ring-3 feature-detection helpers; borderline 'scalar integer'."

# Out of scope for v1. Reasons are a closed set (see docs/SCOPE.md).
excluded:
  - reason: invalid-in-64-bit-mode
    mnemonics: [AAA, AAS, AAM, AAD, DAA, DAS, PUSHA, PUSHAD, POPA, POPAD, BOUND, LDS, LES, SALC]
    note: "INTO is also invalid in 64-bit mode; it is only mentioned on the INT page."
  - reason: privileged
    mnemonics: [IN, OUT, INS, OUTS, CLI, STI, HLT, IRET, IRETQ, SYSRET, SYSEXIT, RDMSR, WRMSR, LGDT, LIDT, LTR, INVD, WBINVD, CLTS]
    note: "Representative list. Every system-programming instruction (SDM Vol. 3) is excluded."
  - reason: segmentation
    mnemonics: [LFS, LGS, LSS, "MOV Sreg"]
    note: "Flat segmentation in long mode; revisit only if there is demand."
  - reason: non-scalar-or-non-integer
    mnemonics: ["x87 FPU (F*)", MMX, "SSE/SSE2/SSE3/SSSE3/SSE4", "AVX/AVX2/AVX-512", AMX, "vector AES/SHA/GFNI"]
  - reason: extended-state
    mnemonics: [XSAVE, XSAVEC, XSAVEOPT, XRSTOR, FXSAVE, FXRSTOR]
