# Scope roster: every instruction page we intend to write for v1.
# Scope = x86-64 long mode, user-space (ring 3), scalar integer / general-purpose. See docs/SCOPE.md.
#
# This file is the denominator for progress tracking and the work queue for authors:
#   - `instructions`  in scope and counted. An instruction page may only exist for a slug listed here.
#   - `deferred`      undecided; NOT counted. Needs an owner decision (see docs/SCOPE.md).
#   - `excluded`      out of scope for v1, with the reason. Do not write pages for these.
#
# Entry fields:  slug (= page filename, lowercase), mnemonic (uppercase primary), category (SDM Vol. 1
# 5.1.x group), sdm (EXACT Vol. 2 outline titles; verify with `uv run docx86 validate --sdm`).
# One SDM entry may feed several pages when its operations behave differently (SHL/SHR/SAR);
# condition-code and operand-width families share one page (JCC, SETCC, CMOVCC, MOVS*).

sdm_revision: "325462-093"

instructions:
  # ---- data-transfer ----
  - {slug: mov,       mnemonic: MOV,       category: data-transfer, sdm: ["MOV—Move"]}
  - {slug: movzx,     mnemonic: MOVZX,     category: data-transfer, sdm: ["MOVZX—Move With Zero-Extend"]}
  - {slug: movsx,     mnemonic: MOVSX,     category: data-transfer, sdm: ["MOVSX/MOVSXD—Move With Sign-Extension"], note: "alias MOVSXD (32->64 sign extension)"}
  - {slug: cmovcc,    mnemonic: CMOVCC,    category: data-transfer, sdm: ["CMOVcc—Conditional Move"], note: "family page: CMOVE, CMOVNE, CMOVA, ... as aliases"}
  - {slug: xchg,      mnemonic: XCHG,      category: data-transfer, sdm: ["XCHG—Exchange Register/Memory With Register"]}
  - {slug: bswap,     mnemonic: BSWAP,     category: data-transfer, sdm: ["BSWAP—Byte Swap"]}
  - {slug: xadd,      mnemonic: XADD,      category: data-transfer, sdm: ["XADD—Exchange and Add"]}
  - {slug: cmpxchg,   mnemonic: CMPXCHG,   category: data-transfer, sdm: ["CMPXCHG—Compare and Exchange"]}
  - {slug: cmpxchg16b, mnemonic: CMPXCHG16B, category: data-transfer, sdm: ["CMPXCHG8B/CMPXCHG16B—Compare and Exchange Bytes"], note: "alias CMPXCHG8B"}
  - {slug: push,      mnemonic: PUSH,      category: data-transfer, sdm: ["PUSH—Push Word, Doubleword, or Quadword Onto the Stack"]}
  - {slug: pop,       mnemonic: POP,       category: data-transfer, sdm: ["POP—Pop a Value From the Stack"]}
  - {slug: cdqe,      mnemonic: CDQE,      category: data-transfer, sdm: ["CBW/CWDE/CDQE—Convert Byte to Word/Convert Word to Doubleword/Convert Doubleword to Quadword"], note: "aliases CBW, CWDE: sign-extend within the accumulator"}
  - {slug: cqo,       mnemonic: CQO,       category: data-transfer, sdm: ["CWD/CDQ/CQO—Convert Word to Doubleword/Convert Doubleword to Quadword"], note: "aliases CWD, CDQ: sign-extend the accumulator into DX/EDX/RDX (used before IDIV)"}

  # ---- binary-arithmetic ----
  - {slug: add,  mnemonic: ADD,  category: binary-arithmetic, sdm: ["ADD—Add"]}
  - {slug: adc,  mnemonic: ADC,  category: binary-arithmetic, sdm: ["ADC—Add With Carry"]}
  - {slug: adcx, mnemonic: ADCX, category: binary-arithmetic, sdm: ["ADCX—Unsigned Integer Addition of Two Operands With Carry Flag"]}
  - {slug: adox, mnemonic: ADOX, category: binary-arithmetic, sdm: ["ADOX — Unsigned Integer Addition of Two Operands With Overflow Flag"]}
  - {slug: sub,  mnemonic: SUB,  category: binary-arithmetic, sdm: ["SUB—Subtract"]}
  - {slug: sbb,  mnemonic: SBB,  category: binary-arithmetic, sdm: ["SBB—Integer Subtraction With Borrow"]}
  - {slug: imul, mnemonic: IMUL, category: binary-arithmetic, sdm: ["IMUL—Signed Multiply"]}
  - {slug: mul,  mnemonic: MUL,  category: binary-arithmetic, sdm: ["MUL—Unsigned Multiply"]}
  - {slug: idiv, mnemonic: IDIV, category: binary-arithmetic, sdm: ["IDIV—Signed Divide"]}
  - {slug: div,  mnemonic: DIV,  category: binary-arithmetic, sdm: ["DIV—Unsigned Divide"]}
  - {slug: inc,  mnemonic: INC,  category: binary-arithmetic, sdm: ["INC—Increment by 1"]}
  - {slug: dec,  mnemonic: DEC,  category: binary-arithmetic, sdm: ["DEC—Decrement by 1"]}
  - {slug: neg,  mnemonic: NEG,  category: binary-arithmetic, sdm: ["NEG—Two's Complement Negation"]}
  - {slug: cmp,  mnemonic: CMP,  category: binary-arithmetic, sdm: ["CMP—Compare Two Operands"]}

  # ---- logical ----
  - {slug: and, mnemonic: AND, category: logical, sdm: ["AND—Logical AND"]}
  - {slug: or,  mnemonic: OR,  category: logical, sdm: ["OR—Logical Inclusive OR"]}
  - {slug: xor, mnemonic: XOR, category: logical, sdm: ["XOR—Logical Exclusive OR"]}
  - {slug: not, mnemonic: NOT, category: logical, sdm: ["NOT—One's Complement Negation"]}

  # ---- shift-rotate ----
  - {slug: shl,  mnemonic: SHL,  category: shift-rotate, sdm: ["SAL/SAR/SHL/SHR—Shift"], note: "alias SAL"}
  - {slug: shr,  mnemonic: SHR,  category: shift-rotate, sdm: ["SAL/SAR/SHL/SHR—Shift"]}
  - {slug: sar,  mnemonic: SAR,  category: shift-rotate, sdm: ["SAL/SAR/SHL/SHR—Shift"]}
  - {slug: shld, mnemonic: SHLD, category: shift-rotate, sdm: ["SHLD—Double Precision Shift Left"]}
  - {slug: shrd, mnemonic: SHRD, category: shift-rotate, sdm: ["SHRD—Double Precision Shift Right"]}
  - {slug: rol,  mnemonic: ROL,  category: shift-rotate, sdm: ["RCL/RCR/ROL/ROR—Rotate"]}
  - {slug: ror,  mnemonic: ROR,  category: shift-rotate, sdm: ["RCL/RCR/ROL/ROR—Rotate"]}
  - {slug: rcl,  mnemonic: RCL,  category: shift-rotate, sdm: ["RCL/RCR/ROL/ROR—Rotate"]}
  - {slug: rcr,  mnemonic: RCR,  category: shift-rotate, sdm: ["RCL/RCR/ROL/ROR—Rotate"]}

  # ---- bit-byte ----
  - {slug: bt,     mnemonic: BT,     category: bit-byte, sdm: ["BT—Bit Test"]}
  - {slug: bts,    mnemonic: BTS,    category: bit-byte, sdm: ["BTS—Bit Test and Set"]}
  - {slug: btr,    mnemonic: BTR,    category: bit-byte, sdm: ["BTR—Bit Test and Reset"]}
  - {slug: btc,    mnemonic: BTC,    category: bit-byte, sdm: ["BTC—Bit Test and Complement"]}
  - {slug: bsf,    mnemonic: BSF,    category: bit-byte, sdm: ["BSF—Bit Scan Forward"]}
  - {slug: bsr,    mnemonic: BSR,    category: bit-byte, sdm: ["BSR—Bit Scan Reverse"]}
  - {slug: setcc,  mnemonic: SETCC,  category: bit-byte, sdm: ["SETcc—Set Byte on Condition"], note: "family page: SETE, SETNE, SETA, ... as aliases"}
  - {slug: test,   mnemonic: TEST,   category: bit-byte, sdm: ["TEST—Logical Compare"]}
  - {slug: crc32,  mnemonic: CRC32,  category: bit-byte, sdm: ["CRC32—Accumulate CRC32 Value"]}
  - {slug: popcnt, mnemonic: POPCNT, category: bit-byte, sdm: ["POPCNT—Return the Count of Number of Bits Set to 1"]}

  # ---- bmi (BMI1 / BMI2 / LZCNT: scalar, GPR-only, VEX-encoded) ----
  - {slug: andn,   mnemonic: ANDN,   category: bmi, sdm: ["ANDN—Logical AND NOT"]}
  - {slug: bextr,  mnemonic: BEXTR,  category: bmi, sdm: ["BEXTR—Bit Field Extract"]}
  - {slug: blsi,   mnemonic: BLSI,   category: bmi, sdm: ["BLSI—Extract Lowest Set Isolated Bit"]}
  - {slug: blsmsk, mnemonic: BLSMSK, category: bmi, sdm: ["BLSMSK—Get Mask Up to Lowest Set Bit"]}
  - {slug: blsr,   mnemonic: BLSR,   category: bmi, sdm: ["BLSR—Reset Lowest Set Bit"]}
  - {slug: bzhi,   mnemonic: BZHI,   category: bmi, sdm: ["BZHI—Zero High Bits Starting with Specified Bit Position"]}
  - {slug: lzcnt,  mnemonic: LZCNT,  category: bmi, sdm: ["LZCNT—Count the Number of Leading Zero Bits"]}
  - {slug: tzcnt,  mnemonic: TZCNT,  category: bmi, sdm: ["TZCNT—Count the Number of Trailing Zero Bits"]}
  - {slug: mulx,   mnemonic: MULX,   category: bmi, sdm: ["MULX—Unsigned Multiply Without Affecting Flags"]}
  - {slug: pdep,   mnemonic: PDEP,   category: bmi, sdm: ["PDEP—Parallel Bits Deposit"]}
  - {slug: pext,   mnemonic: PEXT,   category: bmi, sdm: ["PEXT—Parallel Bits Extract"]}
  - {slug: rorx,   mnemonic: RORX,   category: bmi, sdm: ["RORX — Rotate Right Logical Without Affecting Flags"]}
  - {slug: sarx,   mnemonic: SARX,   category: bmi, sdm: ["SARX/SHLX/SHRX—Shift Without Affecting Flags"]}
  - {slug: shlx,   mnemonic: SHLX,   category: bmi, sdm: ["SARX/SHLX/SHRX—Shift Without Affecting Flags"]}
  - {slug: shrx,   mnemonic: SHRX,   category: bmi, sdm: ["SARX/SHLX/SHRX—Shift Without Affecting Flags"]}

  # ---- control-transfer ----
  - {slug: jmp,   mnemonic: JMP,   category: control-transfer, sdm: ["JMP—Jump"]}
  - {slug: jcc,   mnemonic: JCC,   category: control-transfer, sdm: ["Jcc—Jump if Condition Is Met"], note: "family page: JE, JNE, JA, ... and JRCXZ/JECXZ as aliases"}
  - {slug: call,  mnemonic: CALL,  category: control-transfer, sdm: ["CALL—Call Procedure"]}
  - {slug: ret,   mnemonic: RET,   category: control-transfer, sdm: ["RET—Return From Procedure"]}
  - {slug: loop,  mnemonic: LOOP,  category: control-transfer, sdm: ["LOOP/LOOPcc—Loop According to ECX Counter"], note: "aliases LOOPE, LOOPNE, LOOPZ, LOOPNZ"}
  - {slug: int,   mnemonic: INT,   category: control-transfer, sdm: ["INT n/INTO/INT3/INT1—Call to Interrupt Procedure"], note: "aliases INT3, INT1; note INTO is invalid in 64-bit mode"}
  - {slug: enter, mnemonic: ENTER, category: control-transfer, sdm: ["ENTER—Make Stack Frame for Procedure Parameters"]}
  - {slug: leave, mnemonic: LEAVE, category: control-transfer, sdm: ["LEAVE—High Level Procedure Exit"]}

  # ---- string ----
  - {slug: movs, mnemonic: MOVS, category: string, sdm: ["MOVS/MOVSB/MOVSW/MOVSD/MOVSQ—Move Data From String to String"], note: "aliases MOVSB/W/D/Q"}
  - {slug: cmps, mnemonic: CMPS, category: string, sdm: ["CMPS/CMPSB/CMPSW/CMPSD/CMPSQ—Compare String Operands"], note: "aliases CMPSB/W/D/Q"}
  - {slug: scas, mnemonic: SCAS, category: string, sdm: ["SCAS/SCASB/SCASW/SCASD—Scan String"], note: "aliases SCASB/W/D/Q"}
  - {slug: lods, mnemonic: LODS, category: string, sdm: ["LODS/LODSB/LODSW/LODSD/LODSQ—Load String"], note: "aliases LODSB/W/D/Q"}
  - {slug: stos, mnemonic: STOS, category: string, sdm: ["STOS/STOSB/STOSW/STOSD/STOSQ—Store String"], note: "aliases STOSB/W/D/Q"}
