  - {slug: clc,   mnemonic: CLC,   category: flag-control, sdm: ["CLC—Clear Carry Flag"]}
  - {slug: cmc,   mnemonic: CMC,   category: flag-control, sdm: ["CMC—Complement Carry Flag"]}
  - {slug: std,   mnemonic: STD,   category: flag-control, sdm: ["STD—Set Direction Flag"]}
  - {slug: cld,   mnemonic: CLD,   category: flag-control, sdm: ["CLD—Clear Direction Flag"]}
